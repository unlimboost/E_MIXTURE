.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:18px 16px 28px}
.bar{height:9px;width:62%;background:var(--acc);transform:skewX(-24deg);transform-origin:left;margin:6px 0 10px 6px}
h1{font:italic 800 46px/.95 var(--disp);margin:0;letter-spacing:.5px}
.lead{color:var(--muted);margin:8px 0 18px}
.card{background:var(--card);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
label:first-child{margin-top:0}
input{width:100%;font:italic 700 28px var(--disp);padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--chip);color:var(--text);outline:none}
input:focus-visible{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{border:0;color:var(--text);background:var(--chip);font:italic 800 24px var(--disp);padding:10px 0;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);cursor:pointer}
.chip.on{background:var(--acc);color:#fff}
.chip:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.res{border-left:6px solid var(--acc)}
.big{font:italic 800 64px/1 var(--disp)}
.big small{font-size:28px;margin-left:6px;color:var(--muted)}
.cap{color:var(--muted);font-size:14px}
.mix{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.mix b{font:italic 700 28px var(--disp);display:block}
.err{color:var(--err);font-weight:600}
.row{display:flex;gap:10px}.row>div{flex:1}
.note{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="bg bg-l"></div><div class="bg bg-d"></div>
<div class="wrap">
<div class="bar"></div>
<h1>E-смесь</h1>
<p class="lead">Сколько спирта добавить в бак, чтобы получить нужную смесь.</p>

<div class="card">
<label for="c">Бензина в баке, л</label>
<input id="c" inputmode="decimal" value="20">
<label>Какую смесь получить</label>
<div class="chips" id="chips"></div>
<label for="t">Свой процент этанола, %</label>
<input id="t" inputmode="decimal" value="30">
</div>

<div class="card res">
<div class="cap">Добавить спирта</div>
<div class="big"><span id="rs">–</span><small>л</small></div>
<div class="mix">
<div><b id="rm">–</b><span class="cap">мл спирта</span></div>
<div><b id="rb">–</b><span class="cap">л смеси в баке</span></div>
</div>
<div id="info" style="margin-top:10px"></div>
</div>

<div class="card">
<div class="row">
<div><label for="p">Крепость спирта, %</label><input id="p" inputmode="decimal" value="96"></div>
<div><label for="g">Этанол в бензине, %</label><input id="g" inputmode="decimal" value="0"></div>
</div>
</div>

<p class="note">Расчёт по чистому этанолу, вода в спирте учтена. Подходит ли ваш двигатель для выбранной смеси, проверяйте по руководству к авто.</p>
</div>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const x=parseFloat(String(($(id).value||'0')).replace(',','.'));return isNaN(x)?0:x};
const presets=[10,20,30,40,50,60,70,85];
const chips=$('chips');
presets.forEach(p=>{const b=document.createElement('button');b.className='chip';b.textContent='E'+p;b.onclick=()=>{$('t').value=p;calc()};chips.appendChild(b)});
const f=x=>(Math.round(x*100)/100).toLocaleString('ru-RU');
function calc(){
  const T=num('t')/100,C=num('c'),P=num('p')/100,G=num('g')/100;
  [...chips.children].forEach((b,i)=>b.classList.toggle('on',presets[i]===num('t')));
  const info=$('info'),dash=['rs','rm','rb'];
  const clear=m=>{dash.forEach(i=>$(i).textContent='–');info.innerHTML=m?'<span class="err">'+m+'</span>':''};
  if(C<=0||P<=0||T<=0) return clear('');
  if(T>=P) return clear('Процент этанола не может быть выше крепости спирта.');
  if(T<=G) return clear('В бензине уже столько этанола или больше.');
  const x=C*(T-G)/(P-T),total=C+x;
  $('rs').textContent=f(x);
  $('rm').textContent=Math.round(x*1000).toLocaleString('ru-RU');
  $('rb').textContent=f(total);
  info.innerHTML='<span class="cap">'+f(C)+' л бензина + '+f(x)+' л спирта = '+f(total)+' л смеси E'+Math.round(T*100)+'</span>';
}
['t','c','p','g'].forEach(id=>$(id).addEventListener('input',calc));
calc();
try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.setHeaderColor("#171415");Telegram.WebApp.setBackgroundColor("#171415")}}catch(e){}
</script>
</body>
</html>
